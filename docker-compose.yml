version: '3.8'

services:
   graph:
      build: .
      ports:
        - "8000:8000"
      volumes:
        # 1. 소스 코드 마운트 (실시간 반영)
        - ./server/graph_service:/app/graph_service
        # 2. 라이브러리 코드 주입 (개발용)
        - ./graphiti_core:/app/.venv/lib/python3.12/site-packages/graphiti_core
        # 3. 로그 저장
        - ./logs/graph:/app/logs
      environment:
        #  - OPENAI_API_KEY=${OPENAI_API_KEY}
         - NEO4J_URI=bolt://neo4j:7687
         - NEO4J_USER=${NEO4J_USER}
         - NEO4J_PASSWORD=${NEO4J_PASSWORD}

   neo4j:
    image: neo4j:5.26.2
    profiles: [""]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${NEO4J_PORT:-7474} || exit 1",
        ]
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 3s
    ports:
      - "7474:7474" # HTTP
      - "${NEO4J_PORT:-7687}:${NEO4J_PORT:-7687}" # Bolt
    volumes:
      - neo4j_data:/data
      - ./logs/neo4j:/logs
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-user-dev}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m

volumes:
  neo4j_data: